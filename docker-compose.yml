services:
  desk:
    build: .
    entrypoint: ["python", "-m", "tradingagents.web"]
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      TRADING_DESK_DATA_DIR: /home/appuser/.tradingagents/desk
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    restart: unless-stopped
    init: true
    profiles: [web]

  tradingagents:
    build: .
    env_file:
      - .env
    volumes:
      - ${TRADINGAGENTS_DATA_DIR:-tradingagents_data}:/home/appuser/.tradingagents
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build: .
    env_file:
      - .env
    environment:
      - TRADINGAGENTS_LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    volumes:
      - ${TRADINGAGENTS_DATA_DIR:-tradingagents_data}:/home/appuser/.tradingagents
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  tradingagents_data:
  ollama_data:
